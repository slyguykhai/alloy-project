<!DOCTYPE html>
<html>
<head>
  <title>Bank X Application</title>
</head>
<body>
  <h1>Apply for a Bank X Account</h1>
  <p>Fill out your information to get started.</p>
  <form>
  <label for="first-name">First name</label>
  <input type="text" id="first-name" name="first_name">
  <br><br>
<label for="last-name">Last name</label>
<input type="text" id="last-name" name="last_name">
<br><br>
<label for="email">Email address</label>
<input type="email" id="email" name="email">
<br><br>
<label for="date-of-birth">Date of birth</label>
<input type="date" id="date-of-birth" name="date_of_birth">
<br><br>
<label for="phone">Phone number</label>
<input type="tel" id="phone" name="phone">
<br><br>
<label for="ssn">Social Security number (9 digits, no dashes)</label>
<input type="text" id="ssn" name="ssn"
       inputmode="numeric" maxlength="9" pattern="[0-9]{9}" required>
<br><br>
<label for="address-line-1">Street address</label>
<input type="text" id="address-line-1" name="address_line_1" required> 
<br><br>
<label for="address-line-2">Apartment, suite, etc. (optional)</label>
<input type="text" id="address-line-2" name="address_line_2">     
<br><br>
<label for="city">City</label>
<input type="text" id="city" name="city" required> 
<br><br>
<label for="state">State (two-letter code)</label>
<input type="text" id="state" name="state"
       maxlength="2" pattern="[A-Z]{2}" placeholder="NY" required>
<br><br>
<label for="zip">ZIP code</label>
<input type="text" id="zip" name="zip"
       inputmode="numeric" maxlength="5" pattern="[0-9]{5}" required>
<br><br>
<label for="country">Country</label>
<input type="text" id="country" name="country" value="US" readonly>
<br><br>
<button type="submit">Submit application</button>
</form>
<p id="result"></p>

<script>
  const form = document.querySelector("form");
  const result = document.querySelector("#result");
  const submitButton = form.querySelector('button[type="submit"]');

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const formData = new FormData(form);
    const applicant = Object.fromEntries(formData.entries());

    result.textContent = "Sending application...";
    submitButton.disabled = true;

    try {
      const response = await fetch("/api/apply", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(applicant)
      });

     const data = await response.json();

if (!response.ok) {
  result.textContent = data.message;
  return;
}
result.textContent = data.message;
   } catch (error) {
  result.textContent =
    "Could not complete the request. Check that your backend is running.";
} finally {
  submitButton.disabled = false;
}
  });
</script>
</body>
</html>
